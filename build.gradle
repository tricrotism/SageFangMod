plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "DevAuth"
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
    }
    maven {
        name = "Sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    maven {
        name = "Sonatype Snapshots"
        url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
        mavenContent {
            snapshotsOnly()
        }
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io/"
    }
    maven {
        name = "PaperMC"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

// MC 1.21.10 ships lwjgl-stb 3.3.3 — imgui-java's BOM upgrades it to 3.3.4
// which removed nstbir_resize_uint8, breaking NativeImage.resizeSubRectTo
configurations.all {
    resolutionStrategy {
        force 'org.lwjgl:lwjgl-stb:3.4.1'
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:26.1.0'

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include implementation("io.github.spair:imgui-java-binding:${project.imgui_version}")
    include implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}")

    include implementation("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
    //im a windows user :nerd:
//    include implementation("io.github.spair:imgui-java-natives-linux:${project.imgui_version}")
//    include implementation("io.github.spair:imgui-java-natives-macos:${project.imgui_version}")

    include modImplementation("net.kyori:adventure-platform-fabric:${project.adventure_version}")

    include implementation("io.avaje:avaje-config:5.1")
    include implementation("io.avaje:avaje-applog:1.2")

    include implementation("org.checkerframework:checker-qual:3.53.1")

    modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")

    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")
}

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/sagefang.accesswidener")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

shadowJar {
    zip64 = true
    archiveClassifier = 'shadow'
}

tasks {
    shadowJar {
        relocate("io.github.spair", "com.tricrotism.lib.io.github.spair")
    }

    assemble {
        dependsOn(shadowJar)
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
