plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "DevAuth"
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
    }
    maven {
        name = "Sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    maven {
        name = "Sonatype Snapshots"
        url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
        mavenContent {
            snapshotsOnly()
        }
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io/"
    }
    maven {
        name = "PaperMC"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

// imgui-java's BOM pins lwjgl-stb to 3.3.4, which removed nstbir_resize_uint8 and so breaks
// NativeImage.resizeSubRectTo. The force beats that BOM, and the version must stay equal to the
// lwjgl MC ships (26.2 ships 3.4.1): only those natives are on the launch classpath, so a higher
// stb crashes the dev client at boot with "Failed to locate library: lwjgl_stb.dll".
configurations.all {
    resolutionStrategy {
        force 'org.lwjgl:lwjgl-stb:3.4.1'
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:26.1.0'

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.1.2 ships non-obfuscated, so the new net.fabricmc.fabric-loom plugin
    // does no remapping: use plain implementation (not modImplementation) and no
    // mappings. See https://fabricmc.net/2026/03/14/261.html
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloud command framework
    include implementation("org.incendo:cloud-fabric:${project.cloud_version}")

    include implementation("io.github.spair:imgui-java-binding:${project.imgui_version}")
    include implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}")

    include implementation("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
    include implementation("io.github.spair:imgui-java-natives-linux:${project.imgui_version}")
//    include implementation("io.github.spair:imgui-java-natives-macos:${project.imgui_version}")

    include implementation("net.kyori:adventure-platform-fabric:${project.adventure_version}")

    include implementation("io.avaje:avaje-config:5.2")
    include implementation("io.avaje:avaje-applog:1.2")

    include implementation("org.checkerframework:checker-qual:4.4.0")

    runtimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")

    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")
}

loom {
    accessWidenerPath = file("src/main/resources/sagefang.accesswidener")

    // -PclientJvmArgs="-XX:+UseZGC ..." adds JVM flags to runClient, for A/B testing runtime options
    runs {
        client {
            if (project.hasProperty("clientJvmArgs")) {
                vmArgs(project.property("clientJvmArgs").toString().trim().split("\\s+"))
            }
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// imgui-java hands the Java string to ImGui as a printf format string with one NULL vararg
// behind it, so a percent sign in the text is parsed as a conversion and %n writes through that
// NULL. Server-supplied strings reach these call sites. Use ImGui.textUnformatted, or the
// ImGuiUtil wrappers for the variants that have no unformatted form.
def checkImGuiFormatSinks = tasks.register("checkImGuiFormatSinks") {
    def sources = fileTree("src/main/java") { include "**/*.java" }
    inputs.files(sources)
    doLast {
        def sink = ~/ImGui\.(text|textColored|textDisabled|textWrapped|labelText|bulletText|setTooltip)\(/
        def offenders = []
        sources.each { file ->
            file.eachLine("UTF-8", 1) { line, number ->
                if (sink.matcher(line).find()) offenders << "${file}:${number}: ${line.trim()}"
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "ImGui format-string sinks found, use ImGui.textUnformatted or ImGuiUtil:\n  "
                            + offenders.join("\n  "))
        }
    }
}

tasks.named("check") {
    dependsOn checkImGuiFormatSinks
}

// Dependencies are distributed as Jar-in-Jar nested jars via loom's `include`
// (see META-INF/jars in the remapped artifact), so no shadow/fat jar is needed.

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    // MC 26.1.2 requires Java 25. Use a toolchain so compilation uses a JDK 25
    // even when the Gradle daemon itself runs on an older JVM.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
